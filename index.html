<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sovereign Structor Dashboard</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: monospace; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155; max-width: 500px; }
        .accent { color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Sovereign AI/DI Core</h2>
        <p>Wallet: <span class="accent" id="addr">Loading...</span></p>
        <p>Balance: <span class="accent" id="bal">0.00</span> MTRX</p>
        <p>Status: <span class="accent" id="status">Connecting...</span></p>
    </div>
    <script>
        async function updateMetrics() {
            try {
                const res = await fetch('/api/wallet');
                const data = await res.json();
                document.getElementById('addr').innerText = data.address.substring(0,12) + '...';
                document.getElementById('bal').innerText = data.balance_mtrx;
                document.getElementById('status').innerText = data.status;
            } catch(e) {
                document.getElementById('status').innerText = 'Offline';
            }
        }
        setInterval(updateMetrics, 5000);
        updateMetrics();
    </script>
</body>
</html>
