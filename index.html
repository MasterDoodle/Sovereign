<!DOCTYPE html>
<html>
<head>
    <title>Structor Sovereign HUD</title>
    <meta http-equiv="refresh" content="3">
    <style>
        body { background: #0f172a; color: #38bdf8; font-family: monospace; text-align: center; padding-top: 50px; }
        .card { background: #1e293b; border: 1px solid #334155; display: inline-block; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1 { color: #f8fafc; }
        .stat { font-size: 1.2em; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Structor Sovereign HUD</h1>
        <div class="stat">Status: <span style="color: #4ade80;">LIVE & AUTONOMOUS</span></div>
        <div class="stat">Cost: $0.00 | Memory: 0 Bytes</div>
        <div class="stat">Port: 9337 (io_uring Active)</div>
        <hr style="border-color: #334155; margin: 20px 0;">
        <p>Dashboard refreshes automatically every 3 seconds.</p>
    </div>
</body>
</html>
