<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign AI Workspace</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #131314; color: #e3e3e3; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: #1e1e20; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #2d2d30; }
        .new-chat { background: #2b2b2e; color: #fff; border: 1px solid #3c3c40; padding: 10px 14px; border-radius: 20px; cursor: pointer; font-weight: 500; }
        .chat-container { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .chat-header { padding: 16px 24px; border-bottom: 1px solid #27272a; font-weight: 600; color: #a1a1aa; cursor: pointer; user-select: none; }
        .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; max-width: 800px; margin: 0 auto; width: 100%; }
        .msg { display: flex; gap: 12px; line-height: 1.6; }
        .msg.user { justify-content: flex-end; }
        .bubble { max-width: 80%; padding: 12px 18px; border-radius: 18px; font-size: 15px; }
        .msg.user .bubble { background: #2f2f32; color: #fff; }
        .msg.ai .bubble { background: transparent; color: #e3e3e3; }
        .input-area { padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; }
        .input-box { background: #1e1e20; border: 1px solid #333336; border-radius: 28px; padding: 12px 20px; display: flex; align-items: center; }
        .input-box input { background: transparent; border: none; color: #fff; flex: 1; outline: none; font-size: 15px; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 999; justify-content: center; align-items: center; }
        .modal-card { background: #1c2541; padding: 24px; border-radius: 12px; width: 90%; max-width: 550px; border: 1px solid #3a506b; }
        .accent { color: #48cae4; font-weight: bold; word-break: break-all; }
        .btn { background: #0077b6; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <button class="new-chat">+ New Conversation</button>
        <div style="font-size: 12px; color: #71717a;">Sovereign AI v2.5</div>
    </div>

    <div class="chat-container">
        <div class="chat-header" ondblclick="toggleAdminModal()">
            ✦ Sovereign AI Thought Partner <span style="font-size: 11px; opacity: 0.5;">(Double click for telemetry)</span>
        </div>
        <div class="messages" id="chat_messages">
            <div class="msg ai"><div class="bubble">Hello! How can I assist you today?</div></div>
        </div>
        <div class="input-area">
            <div class="input-box">
                <input type="text" id="user_input" placeholder="Ask Sovereign AI anything..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button style="background:#e3e3e3; border:none; border-radius:50%; width:32px; height:32px; cursor:pointer;" onclick="sendMessage()">↑</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="admin_modal">
        <div class="modal-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="margin:0; color:#fff;">Sovereign Node Telemetry</h3>
                <button onclick="toggleAdminModal()" style="background:none; border:none; color:#fff; cursor:pointer;">✕</button>
            </div>
            <hr style="border-color:#3a506b; margin: 15px 0;">
            <p>Target Wallet:<br><span class="accent" id="addr">Loading...</span></p>
            <p>Mined Balance: <span class="accent" id="bal">0.00</span> MTRX</p>
            <p>Blocks Mined: <span class="accent" id="blocks">0</span></p>
            <p>Avg Hash Rate: <span class="accent" id="hashrate">0</span> H/s</p>
            <button class="btn" onclick="connectWallet()">Connect MetaMask Wallet</button>
            <button class="btn" style="background:#10b981;" onclick="claimOnChain()">Generate Claim Proof</button>
        </div>
    </div>

    <script>
        let pollInterval = null;

        async function fetchAdminMetrics() {
            try {
                const res = await fetch('/api/admin/wallet');
                const data = await res.json();
                document.getElementById('addr').innerText = data.address;
                document.getElementById('bal').innerText = data.balance_mtrx;
                document.getElementById('blocks').innerText = data.blocks_mined;
                document.getElementById('hashrate').innerText = data.avg_hashrate;
            } catch(e) {}
        }

        function toggleAdminModal() {
            const modal = document.getElementById('admin_modal');
            const isHidden = modal.style.display === '' || modal.style.display === 'none';
            modal.style.display = isHidden ? 'flex' : 'none';
            
            if (isHidden) {
                fetchAdminMetrics();
                pollInterval = setInterval(fetchAdminMetrics, 2000);
            } else {
                clearInterval(pollInterval);
            }
        }

        async function connectWallet() {
            if (window.ethereum) {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const wallet = accounts[0];
                await fetch('/api/admin/set_wallet', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({address: wallet})
                });
                alert('Target Wallet Bound to MetaMask: ' + wallet);
                fetchAdminMetrics();
            } else { alert('MetaMask extension required'); }
        }

        async function claimOnChain() {
            const res = await fetch('/api/admin/claim');
            const data = await res.json();
            alert(`Claim Proof Hash Generated:\n${data.proof_hash}`);
        }

        async function sendMessage() {
            const input = document.getElementById('user_input');
            const text = input.value.trim();
            if(!text) return;
            const msgs = document.getElementById('chat_messages');
            msgs.innerHTML += `<div class="msg user"><div class="bubble">${text}</div></div>`;
            input.value = '';
            msgs.scrollTop = msgs.scrollHeight;

            const res = await fetch('/api/chat', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({message: text})});
            const data = await res.json();
            msgs.innerHTML += `<div class="msg ai"><div class="bubble">${data.reply}</div></div>`;
            msgs.scrollTop = msgs.scrollHeight;
        }
    </script>
</body>
</html>
